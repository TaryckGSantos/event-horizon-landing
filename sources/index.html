<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NULLA</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Tenor+Sans&family=Cormorant+SC:wght@300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./components/ui/spotlight-card.css">
        <link rel="stylesheet" href="./style.css">
        <link rel="stylesheet" href="./news-portal.css">
        <link rel="stylesheet" href="./phrase-transition.css">
        <link rel="stylesheet" href="./timeline.css">
        <link rel="stylesheet" href="./apod.css">
    </head>
    <body>
        <div id="fade-overlay" style="
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.55s ease;
"></div>

        <div class="experience"></div>

        <div id="hero" aria-hidden="true">
            <div id="hero-inner">
                <h1 id="hero-title">NULLA</h1>
                <div id="hero-line"></div>
                <p  id="hero-subtitle">Onde tudo desaparece, algo começa.</p>
            </div>
        </div>

        <!-- Tela 2.1 — Linha do tempo cósmica (antes dos cards) -->
        <div id="timeline-overlay" aria-hidden="true">
            <canvas id="timeline-canvas"></canvas>
        </div>
        <div id="tl-scroll-hint" aria-hidden="true">
            <span>scroll</span>
            <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
                <line x1="8" y1="2" x2="8" y2="14" stroke="rgba(170,140,255,0.42)" stroke-width="1.3" stroke-linecap="round"/>
                <polyline points="4,11 8,15 12,11" stroke="rgba(170,140,255,0.42)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
            </svg>
        </div>

        <div id="cards-overlay" aria-hidden="true">
            <div class="cards-row"></div>
        </div>

        <div id="phrase-transition" aria-hidden="true">
            <p class="phrase-text">do silêncio, algo escapa</p>
        </div>

        <!-- timeline.js carregado ANTES de index.js para que seu listener de wheel
             seja registrado antes do CameraScroll (necessário para __timelineCapturing) -->
        <script type="module" src="./timeline.js"></script>
        <script type="module" src="./index.js"></script>
        <script type="module" src="./hero.js"></script>
        <script type="module" src="./cards.js"></script>
        <script type="module" src="./phrase-transition.js"></script>
        <script type="module" src="./apod.js"></script>
        <script type="module" src="./news-portal.js"></script>
    </body>
</html>
